<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager — Accounting</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/form-editor-embedded.css">
<link rel="stylesheet" href="css/users.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/txn-forms.css">
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-card">
    <div class="brand"><div class="logo">M</div><h1>Manager</h1><p>Accounting for your businesses</p></div>
    <!-- login / first-run setup / MFA, rendered by js/users.js -->
    <div id="authBody"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <div id="impBar" class="imp-bar hide" role="status"></div>
  <!-- One bar for the whole app: global tabs plus, once a business is open, the
       workspace controls that used to sit in a second row below. -->
  <div class="toolbar">
    <div class="tb-left">
      <button class="hd-icon nav-toggle" id="navToggle" title="Menu" aria-label="Open navigation"
        aria-expanded="false" onclick="App.toggleNav()"></button>
      <span class="tb-ico tb-home" data-ico="dashboard"></span>
      <div class="tb-ws hide" id="tbWsHead">
        <span class="ws-close" title="Close business" onclick="App.closeBusiness()"></span>
        <span class="ws-biz-name" id="wsBizName"></span>
        <a onclick="App.renameBusiness()">Rename</a>
      </div>
    </div>
    <div class="tb-nav">
      <button class="tb-btn" id="tabBiz" onclick="App.go('businesses')"><span class="tb-ico" data-ico="briefcase"></span>Businesses</button>
      <button class="tb-btn" id="tabUsers" onclick="App.go('users')"><span class="tb-ico" data-ico="users"></span>Users</button>
      <button class="tb-btn" id="tabSupport" onclick="App.go('support')"><span class="tb-ico" data-ico="lifebuoy"></span>Support</button>
      <button class="tb-btn" id="tabProfile" onclick="App.go('profile')"><span class="tb-ico" data-ico="user"></span><span id="tbProfileName">Profile</span></button>
      <button class="tb-btn" onclick="App.logout()"><span class="tb-ico" data-ico="logout"></span>Logout</button>
    </div>
    <div class="tb-right">
      <div class="tb-ws hide" id="tbWsTools">
        <div class="hd-search">
          <input id="wsSearch" type="search" placeholder="Search…" aria-label="Search this business"
            oninput="App.globalSearch(this.value)" onkeydown="if(event.key==='Escape'){this.value='';App.globalSearch('')}">
        </div>
        <button class="hd-icon" id="hdNotify" title="Notifications" aria-label="Notifications"
          onclick="App.openNotifications()"></button>
        <button class="btn btn-sm" onclick="App.openTool('emails')">Emails</button>
        <button class="btn btn-sm" onclick="App.openTool('history')">History</button>
        <button class="btn btn-sm" onclick="App.openTool('backup')">Backup</button>
        <div class="hd-user" role="button" tabindex="0" title="Profile" onclick="App.go('profile')" onkeydown="if(event.key==='Enter'){App.go('profile')}"><span class="hd-avatar" id="hdAvatar">A</span>
          <span class="hd-user-txt"><span class="hd-user-name" id="hdUserName">Administrator</span>
          <span class="hd-user-role" id="hdUserRole">Administrator</span></span></div>
      </div>
      <button class="hd-icon" title="Toggle light / dark theme" aria-label="Toggle light / dark theme"
        onclick="App.toggleTheme()" id="hdTheme"></button>
    </div>
  </div>

  <div id="pageBusinesses" class="page">
    <div class="page-head"><h1 class="page-title">Businesses</h1></div>
    <div class="actions">
      <div class="dd" id="addDd">
        <button class="btn btn-primary" onclick="App.toggleAdd(event)">Add Business <i class="caret"></i></button>
        <div class="dd-menu hide" id="addMenu">
          <button onclick="App.showCreate()">Create New Business</button>
          <button onclick="App.importBusiness()">Import Business</button>
        </div>
      </div>
      <button class="btn btn-danger" id="removeBtn" onclick="App.removeSelected()" disabled>Remove</button>
      <div class="search"><span class="ic" data-ico="search"></span><input id="bizSearch" type="text" placeholder="Search businesses…" oninput="App.renderBusinesses()"></div>
    </div>
    <div id="bizListWrap"></div>
    <div class="count" id="bizCount"></div>
  </div>

  <div id="pageCreate" class="page hide">
    <div class="card">
      <h2>Create New Business</h2>
      <p class="sub">Choose a country to pre-set currency, date format and chart of accounts.</p>
      <label class="fld">Business Name</label>
      <input id="newBizName" type="text" placeholder="Unnamed" onkeydown="if(event.key==='Enter')App.createBusiness()">
      <label class="fld">Country</label>
      <select id="newBizCountry"><option value="">Automatic</option>
        <option>United Arab Emirates</option><option>United States</option><option>United Kingdom</option>
        <option>Australia</option><option>Canada</option><option>India</option><option>Pakistan</option>
        <option>Saudi Arabia</option><option>Singapore</option><option>New Zealand</option></select>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="App.createBusiness()">Add Business</button>
        <button class="btn" onclick="App.go('businesses')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Users, user form and Profile are rendered by js/users.js -->
  <div id="pageUsers" class="page hide"><div id="usersBody"></div></div>

  <div id="pageNewUser" class="page hide"><div id="userFormBody"></div></div>

  <div id="pageProfile" class="page hide"><div id="profileBody"></div></div>

  <div id="pageSupport" class="page hide">
    <div class="page-head"><h1 class="page-title">Support</h1></div>
    <div id="supportBody"></div>
  </div>

  <div id="pageWorkspace" class="hide" style="flex:1;display:flex;flex-direction:column">
    <div class="ws-body">
      <div class="side-scrim" onclick="App.closeNav()"></div>
      <aside class="sidebar" id="sidebar"></aside>
      <main class="ws-main" id="wsMain"></main>
    </div>
  </div>

  <div class="foot" id="appFoot">Manager · Steps 1–3 · data is stored locally in this browser</div>
</div>

<script src="js/icons.js"></script>
<script src="js/ui-modal.js"></script>
<script src="js/data.js"></script>
<script src="js/accounting.js"></script>
<script src="js/app.js"></script>
<script src="js/users.js"></script>
<script src="js/designer.js"></script>
<script src="js/form-editor-bridge.js"></script>
<template id="fedTpl"><div id="fedHost" class="embedded">
  <div class="topbar">
    <div class="brand"><div class="mark">F</div><div><h1>Form HTML Editor</h1><small>Build &amp; export form layouts</small></div></div>
    <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)">Document
      <select id="docSelect" onchange="FED.switchDoc(this.value)" style="border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;font-family:inherit;background:#fff;font-weight:600;color:var(--ink)"></select>
    </label>
    <div class="tabs">
      <button id="tabElements" class="on" onclick="FED.setTab('elements')">Form Elements</button>
      <button id="tabSettings" onclick="FED.setTab('settings')">Form Settings</button>
    </div>
    <div class="spacer"></div>
    <button class="tbtn" onclick="FED.resetDefault()">↺ Reset to default</button>
    <button class="tbtn primary" onclick="FED.updateExit()">Update</button>
  </div>

  <div class="shell">
    <div class="main-col">
      <aside class="props">
        <div class="props-head" id="propsHead">⚙ Properties</div>
        <div class="props-body" id="props"></div>
      </aside>

      <main class="canvas-wrap">
        <div class="canvas-bar">
          <span class="ttl" id="canvasTitle">Form canvas</span>
          <div class="seg"><button id="fed_vbPreview" class="on" onclick="FED.setView('preview')">Preview</button><button id="fed_vbCode" onclick="FED.setView('code')">HTML</button></div>
        </div>
        <div id="stage"></div>
      </main>
    </div>

    <aside class="rail">
      <div class="rail-head"><div class="t" id="railTitle">Form Elements</div><div class="s" id="railSub">Click an item to add it to the form</div></div>
      <div class="rail-scroll" id="rail"></div>
    </aside>
  </div>

</div></template>
<script src="js/form-editor-embedded.js"></script>
<link rel="stylesheet" href="dist/invoice-designer/invoice-designer.css">
<script src="dist/invoice-designer/invoice-designer.js"></script>
<script src="js/invoice-designer-bridge.js"></script>
<script src="js/quick-create.js"></script>
<script src="js/allocations.js"></script>
<script src="js/party-balance.js"></script>
<script src="js/enter-nav.js"></script>
<script src="js/settings-pages.js"></script>
<script src="js/txn-forms.js"></script>
</body>
</html>
